<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-Learning Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js"></script>
</head>
<body>

<!-- ===== หน้าล็อกอิน ===== -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <img id="logoLogin" alt="Digiserve" style="height:56px;width:auto">
    </div>
    <h1>E-Learning Platform</h1>
    <p class="sub">ระบบอบรมและทดสอบออนไลน์</p>
    <form id="loginForm">
      <div class="field"><label>อีเมล</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required></div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn btn-primary" id="loginBtn" type="submit">เข้าสู่ระบบ</button>
    </form>
  </div>
</div>

<!-- ===== แอปหลัก ===== -->
<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <img id="logoSide" alt="" style="height:22px;width:auto;vertical-align:middle">
      E-Learning
    </div>
    <nav>
      <a data-nav="home" class="active">หน้าหลัก</a>
      <a data-nav="lessons">บทเรียน</a>
      <a data-nav="quizzes">แบบทดสอบ</a>
      <a data-nav="typing">พิมพ์ดีด</a>
      <a data-nav="assign" class="adminNav" style="display:none">มอบหมายงาน</a>
      <a data-nav="progress" class="adminNav" style="display:none">ความคืบหน้า</a>
      <a data-nav="dashboard" class="adminNav" style="display:none">แดชบอร์ดผลสอบ</a>
      <a data-nav="cert" class="adminNav" style="display:none">ใบประกาศ</a>
      <a data-nav="managelessons" class="adminNav" style="display:none">จัดการบทเรียน</a>
      <a data-nav="admin" class="adminNav" style="display:none">จัดการผู้ใช้</a>
    </nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="logo">
        <img id="logoTop" alt="Digiserve" style="height:28px;width:auto">
        <b style="margin-left:8px">E-Learning Platform</b>
        <span style="margin-left:8px;color:var(--muted);font-size:13px">Digiserve Corporation</span>
      </div>
      <div class="who" style="position:relative;display:flex;align-items:center;gap:16px">
        <span id="langToggle" style="cursor:pointer;user-select:none;font-size:13px;display:inline-flex;gap:6px;align-items:center">
          <span data-lang="th">TH</span><span style="color:var(--line)">|</span><span data-lang="en">EN</span>
        </span>
        <span id="userMenuBtn" style="cursor:pointer;user-select:none">สวัสดี <b id="whoName">-</b> <span style="color:var(--muted)">▾</span></span>
        <div id="userMenu" class="hidden" style="position:absolute;right:0;top:30px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:170px;z-index:60;overflow:hidden">
          <a id="menuPass" style="display:block;padding:11px 15px;cursor:pointer;font-size:14px;color:var(--ink)">🔑 เปลี่ยนรหัสผ่าน</a>
          <a id="logoutBtn" style="display:block;padding:11px 15px;cursor:pointer;font-size:14px;color:var(--danger);border-top:1px solid var(--line)">ออกจากระบบ</a>
        </div>
      </div>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="logo.js"></script>
<script>
  document.getElementById('logoLogin').src = window.LOGO_FULL;
  document.getElementById('logoTop').src   = window.LOGO_MARK;
  document.getElementById('logoSide').src  = window.LOGO_MARK;
</script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
